apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: ssh-client
  namespace: tekton-worker
spec:
  workspaces:
    - name: output
    - name: ssh-directory
  params:
    - name: sub-dir
      type: string
      default: "."
    - name: dist-dir
      type: string
      default: "dist"
    - name: host
      type: array
      default: []
    - name: dst-dir
      type: string
    - name: image
      type: string
      default: "docker.io/kroniak/ssh-client:latest"
  steps:
    - name: ssh-client-run
      image: $(params.image)
      args: ["$(params.host[*])"]
      workingDir: $(workspaces.output.path)/$(params.sub-dir)/$(params.dist-dir)
      script: |
        #!/usr/bin/env sh
        set -eu
        cp -R $(workspaces.ssh-directory.path) ~/.ssh
        chmod 700 ~/.ssh
        chmod -R 400 ~/.ssh/*
        echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
        ls
        for each in $@ 
        do
            echo $each
            ssh -i ~/.ssh/id_rsa work@$each "ls $(params.dst-dir) || mkdir -p $(params.dst-dir)"
            scp -rvp . work@$each:$(params.dst-dir)
        done
